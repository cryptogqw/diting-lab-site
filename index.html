(function () {
  var langs = ["zh", "ja", "en"], pick = null;
  try { pick = localStorage.getItem("diting-lang"); } catch (e) {}
  if (langs.indexOf(pick) < 0) {
    var nav = (navigator.languages || [navigator.language || "en"]).join(",").toLowerCase();
    pick = /(^|,)ja/.test(nav) ? "ja" : /(^|,)zh/.test(nav) ? "zh" : "en";
  }
  location.replace(pick + "/index.html");
})();
</script>
